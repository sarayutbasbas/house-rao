services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker.local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    env_file: .env.docker.local
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy

  homeshelf:
    build: .
    image: homeshelf:local
    container_name: homeshelf
    restart: unless-stopped
    env_file: .env.docker.local
    environment:
      NODE_ENV: production
      PORT: "8002"
      HOSTNAME: 0.0.0.0
      AUTH_TRUST_HOST: "true"
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:2026.9.3
    container_name: homeshelf-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/cloudflared-token
    volumes:
      - "${HOME}/Library/Application Support/com.cloudflare.cloudflared/token:/run/cloudflared-token:ro"
    depends_on:
      homeshelf:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
